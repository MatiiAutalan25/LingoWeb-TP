<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | LingoWeb</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="registro.css" />
  </head>
  <body>
    <!-- ===== Sección principal =====
         Sin menú de navegación: todavía no hay sesión iniciada. -->
    <main>
      <section class="register-card">
        <!-- ======= Banner institucional con el imagotipo ======= -->
        <div class="register-banner">
          <p class="brand"><span aria-hidden="true">L</span> LingoWeb</p>
          <p class="tagline">
            Creá tu cuenta y empezá hoy con tu primer idioma
          </p>
        </div>

        <div class="register-body">
          <h1>Crear cuenta</h1>

          <!-- ======= Formulario de registro ======= -->
          <form class="register-form">
            <label for="full-name">Nombre completo</label>
            <input
              id="full-name"
              name="full-name"
              type="text"
              placeholder="Juan Pérez"
              autocomplete="name"
              required
            />

            <label for="user">Usuario</label>
            <input
              id="user"
              name="user"
              type="text"
              placeholder="juanperez_web"
              autocomplete="username"
              required
            />

            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="juan.perez@alumnos.unlam.edu.ar"
              autocomplete="email"
              required
            />

            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Mínimo 8 caracteres"
              minlength="8"
              autocomplete="new-password"
              required
            />

            <label for="confirm-password">Confirmar contraseña</label>
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              placeholder="Repetí la contraseña"
              minlength="8"
              autocomplete="new-password"
              required
            />

            <a class="btn-primary" href="../login/login.html">Crear cuenta</a>
          </form>

          <!-- ======= Vuelta al login ======= -->
          <p class="register-links">
            ¿Ya tienes cuenta?
            <a href="../login/login.html">Inicia sesión</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
