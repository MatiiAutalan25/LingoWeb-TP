<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Niveles - Alemán</title>
    <link rel="stylesheet" href="../../../style.css" />
    <link rel="stylesheet" href="../mapa.css" />
  </head>
  <body>
    <div class="app-top">
      <header class="app-header">
        <a class="brand" href="../../dashboard/dashboard.html">
          <span aria-hidden="true">L</span> LingoWeb
        </a>
        <div class="quick-stats">
          <span>🔥 5 días</span>
          <span>⚡ 350 XP</span>
          <a href="../../perfil/perfil.html" aria-label="Mi perfil">JP</a>
        </div>
      </header>
      <nav class="main-nav">
        <a class="active" href="../../dashboard/dashboard.html" aria-current="true"
          >Cursos</a
        >
        <a href="../../perfil/perfil.html">Perfil</a>
        <a href="../../ranking/ranking.html">Ranking</a>
        <a href="../../tienda-rachas/tienda-rachas.html">Tienda / Rachas</a>
      </nav>
    </div>

    <h1>Lecciones del Curso de Alemán</h1>
    <main class="map-container">
      <div class="level-row">
        <div class="node-wrapper active">
          <div class="tooltip">EMPEZAR</div>
          <div class="node-ring">
            <a class="node current" href="../../leccion/leccion-aleman.html">
              <span class="icon">★</span>
            </a>
          </div>
        </div>
      </div>

      <div class="level-row offset-left-1">
        <button class="node locked" type="button">
          <span class="icon">★</span>
        </button>
      </div>

      <div class="level-row has-mascot">
        <button class="node locked square-icon" type="button">
          <span class="icon">🎁</span>
        </button>
      </div>

      <div class="level-row offset-right-1">
        <button class="node locked" type="button">
          <span class="icon">🎧</span>
        </button>
      </div>

      <div class="level-row offset-left-2">
        <button class="node locked" type="button">
          <span class="icon">★</span>
        </button>
      </div>

      <div class="level-row">
        <button class="node locked" type="button">
          <span class="icon">🏆</span>
        </button>
      </div>
    </main>

    <footer class="map-footer">
      <a class="back-link" href="../../dashboard/dashboard.html">Volver a Cursos</a>
    </footer>
  </body>
</html>
