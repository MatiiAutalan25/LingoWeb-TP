<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Niveles - Inglés</title>
    <link rel="stylesheet" href="../mapa.css" />
  </head>
  <body>
    <main class="map-container">
      <div class="level-row">
        <div class="node-wrapper active">
          <div class="tooltip">EMPEZAR</div>
          <div class="node-ring">
            <a class="node current" href="../../leccion/leccion-ingles.html">
              <span class="icon">★</span>
            </a>
          </div>
        </div>
      </div>

      <div class="level-row offset-left-1">
        <button class="node locked" type="button">
          <span class="icon">★</span>
        </button>
      </div>

      <div class="level-row has-mascot">
        <button class="node locked square-icon" type="button">
          <span class="icon">🎁</span>
        </button>
      </div>

      <div class="level-row offset-right-1">
        <button class="node locked" type="button">
          <span class="icon">🎧</span>
        </button>
      </div>

      <div class="level-row offset-left-2">
        <button class="node locked" type="button">
          <span class="icon">★</span>
        </button>
      </div>

      <div class="level-row">
        <button class="node locked" type="button">
          <span class="icon">🏆</span>
        </button>
      </div>
    </main>
  </body>
</html>
