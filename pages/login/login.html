<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de sesión | LingoWeb</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="login.css" />
    <script type="module" src="../../js/main.js"></script>
  </head>
  <body data-page="login">
    <!-- ===== Sección principal ===== -->
    <main>
      <section class="login-card">
        <!-- ======= Banner institucional con el imagotipo ======= -->
        <div class="login-banner">
          <p class="brand"><span aria-hidden="true">L</span> LingoWeb</p>
          <p class="tagline">
            Aprende Inglés, Alemán y Chino gratis y de forma divertida
          </p>
        </div>

        <div class="login-body">
          <h1>Iniciar sesión</h1>

          <!-- ======= Formulario de credenciales ======= -->
          <form
            class="login-form"
            method="get"
            action="../dashboard/dashboard.html"
            novalidate
          >
            <label for="user">Usuario / Email</label>
            <input
              id="user"
              name="user"
              type="text"
              placeholder="juanperez_web"
              autocomplete="username"
              required
            />

            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            />

            <button class="btn-primary" type="submit">Iniciar Sesión</button>

            <!-- Resultado de la validación (lo completa js/view/login.view.js) -->
            <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
          </form>

          <!-- ======= Enlaces de ayuda ======= -->
          <p class="login-links">
            <a href="../recuperar/recuperar.html">¿Olvidaste tu contraseña?</a>
          </p>
          <p class="login-links">
            ¿No tienes cuenta?
            <a href="../registro/registro.html">Créala aquí</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
