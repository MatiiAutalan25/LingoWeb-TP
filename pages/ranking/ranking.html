<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking | LingoWeb</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="ranking.css" />
    <script type="module" src="../../js/main.js"></script>
  </head>
  <body data-page="ranking">
    <div class="app-top">
      <header class="app-header">
        <a class="brand" href="../dashboard/dashboard.html">
          <span aria-hidden="true">L</span> LingoWeb
        </a>
        <!-- Los valores los completa js/view/header.view.js -->
        <div class="quick-stats">
          <span id="header-racha">🔥 — días</span>
          <span id="header-xp">⚡ — XP</span>
          <a id="header-avatar" href="../perfil/perfil.html" aria-label="Mi perfil">—</a>
        </div>
      </header>
      <nav class="main-nav">
        <a href="../dashboard/dashboard.html">Cursos</a>
        <a href="../perfil/perfil.html">Perfil</a>
        <a class="active" href="../ranking/ranking.html" aria-current="page"
          >Ranking</a
        >
       <a href="../tienda-rachas/tienda-rachas.html">Tienda / Rachas</a>
      </nav>
    </div>

    <!-- ===== Sección principal ===== -->
    <main>
      <section class="page-heading">
        <h1 class="ranking-title">Ranking de estudiantes</h1>
        <p>Competí cada semana y subí de liga según la XP que sumes.</p>
      </section>

      <!-- ======= Selector de liga ======= -->
      <section class="league-picker">
        <label for="league">Liga actual</label>
        <select id="league" name="league">
          <option value="bronce" selected>Liga de Bronce</option>
          <option value="plata">Liga de Plata</option>
          <option value="oro">Liga de Oro</option>
        </select>
      </section>

      <!-- ======= Tabla de clasificación =======
           Las filas se arman desde los datos (js/view/ranking.view.js) -->
      <section class="ranking-card" aria-live="polite">
        <table class="ranking-table">
          <caption>
            <strong
              ><span aria-hidden="true">🏆</span> Tabla de Clasificación ·
              <span id="ranking-league-name">Liga de Bronce</span></strong
            >
            <span id="ranking-league-rule"></span>
          </caption>

          <thead>
            <tr>
              <th scope="col">Puesto</th>
              <th scope="col" class="col-student">Estudiante</th>
              <th scope="col">XP Semanal</th>
              <th scope="col">Estado</th>
            </tr>
          </thead>

          <tbody id="ranking-body"></tbody>
        </table>

        <!-- Estado vacío: se muestra si la liga no tiene participantes -->
        <p id="ranking-empty" class="ranking-empty" hidden></p>
      </section>
    </main>
  </body>
</html>
